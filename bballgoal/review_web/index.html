<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bballgoal</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d2129; --muted: #6b7280; --line: #e3e5e9; --soft: #eef0f3;
  --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111318; --panel: #1b1e25; --text: #e6e8ec; --muted: #9aa1ad; --line: #2c313b; --soft: #232731; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
button { font: inherit; }
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 17px; letter-spacing: .3px; }
.logo span { color: var(--accent); }
select, input[type=text], input:not([type]) { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 12px; border-radius: 7px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.steps { display: flex; gap: 0; padding: 0 16px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; color: var(--muted); }
.step.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--soft); color: var(--muted); font-weight: 700; }
.step.done .dot { background: var(--ok); color: #fff; }
.step.ready .dot { background: var(--accent); color: #fff; }
.step.running .dot { background: var(--warn); color: #fff; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
main { padding: 16px; max-width: 1500px; margin: 0 auto; }
.intro { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
.intro h2 { margin: 0 0 4px; font-size: 18px; }
.intro p { margin: 4px 0; color: var(--muted); }
.intro b { color: var(--text); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
.muted { color: var(--muted); }
.jobs { display: grid; gap: 8px; }
.job { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; }
.job .name { font-weight: 600; }
.pbar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.pbar > div { height: 100%; background: var(--accent); transition: width .5s; }
.pbar.indet > div { width: 30% !important; animation: slide 1.2s infinite linear; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.job .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -6px; }
.err { color: var(--bad); }
.sources { display: grid; gap: 8px; }
.source { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.source.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--soft); color: var(--muted); }
.courtwrap { position: relative; display: inline-block; max-width: 100%; }
.courtwrap canvas { max-width: 100%; border-radius: 6px; cursor: crosshair; display: block; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.hint { padding: 6px 10px; border-radius: 6px; background: var(--soft); }
/* 认人 */
.roster { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.roster .team { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.roster input.teamname { width: 80px; font-weight: 700; border-style: dashed; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px 1px 2px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.chip.ok { border-color: var(--ok); }
.chip svg { width: 22px; height: 22px; }
.filters button { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 3px 10px; border-radius: 6px; cursor: pointer; }
.filters button.on, .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.seg button { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 3px 10px; border-radius: 6px; cursor: pointer; }
.reels { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 14px; align-items: start; }
@media (max-width: 820px) { .reels { grid-template-columns: 1fr; } }
.rlist { padding: 6px; max-height: 78vh; overflow: auto; }
.rteam { font-size: 12px; font-weight: 700; color: var(--muted); padding: 10px 8px 4px; text-transform: uppercase; letter-spacing: .03em; }
.rrow { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: var(--text); padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.rrow:hover { background: var(--soft); }
.rrow.sel { background: var(--soft); border-color: var(--accent); }
.rrow.empty { opacity: .5; }
.rnum { font-size: 18px; font-weight: 800; text-align: center; }
.rname { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rbadges { display: flex; gap: 4px; align-items: center; }
.rbadge { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--ok); color: #fff; }
.rhead { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.rbig { font-size: 40px; font-weight: 800; line-height: 1; min-width: 70px; }
.rstats { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.rstats > div { display: flex; flex-direction: column; align-items: center; }
.rstats b { font-size: 20px; }
.rtop { margin: 10px 0 4px; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.rtop li { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 6px; background: var(--soft); }
.ractions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 6px; }
.raction { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
.card.confirmed { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.card.dragover, .newzone.dragover, .pool.dragover { outline: 3px dashed var(--accent); }
.avatar { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; position: relative; cursor: grab; }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .15s; }
.avatar:hover img.photo { opacity: 1; }
.head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.title { font-weight: 700; font-size: 16px; }
.meta { color: var(--muted); font-size: 12px; }
.head input.num { width: 60px; } .head input.name { width: 130px; }
.confirm { border: 1px solid var(--ok); color: var(--ok); background: transparent; border-radius: 6px; padding: 3px 14px; cursor: pointer; font-weight: 600; }
.card.confirmed .confirm { background: var(--ok); color: #fff; }
.warn { color: var(--warn); font-size: 12px; }
.tracks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.track { position: relative; border: 1px solid var(--line); border-radius: 6px; padding: 3px; background: var(--soft); cursor: grab; }
.track .imgs { display: flex; gap: 2px; }
.track img { height: 104px; border-radius: 3px; display: block; }
.track.small img { height: 66px; }
.track .cap { font-size: 11px; color: var(--muted); text-align: center; }
.track .x { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 13px; line-height: 20px; padding: 0; }
.track .x:hover { background: var(--bad); }
.more { align-self: center; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.newzone { border: 2px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); }
#preview { position: fixed; right: 16px; bottom: 16px; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#preview img { max-height: 42vh; max-width: 40vw; display: block; }
#preview div { font-size: 12px; color: var(--muted); text-align: center; }
/* 问题 */
.question { display: grid; grid-template-columns: 1fr 360px; gap: 16px; }
.question .shots { display: flex; gap: 6px; flex-wrap: wrap; }
.question .shots img { height: 260px; border-radius: 6px; }
.choices { display: grid; gap: 8px; align-content: start; }
.choice { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; background: var(--panel); color: var(--text); text-align: left; }
.choice:hover { border-color: var(--accent); }
.choice svg { width: 52px; height: 52px; flex: none; }
.key { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
.modal > div { background: var(--panel); border-radius: 12px; padding: 16px; max-width: 96vw; max-height: 92vh; overflow: auto; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.strip figure { margin: 0; cursor: pointer; border: 3px solid transparent; border-radius: 6px; padding: 2px; text-align: center; font-size: 11px; color: var(--muted); }
.strip figure:hover { border-color: var(--warn); }
.strip figure.after { opacity: .55; }
.strip figure.cut { border-color: var(--bad); opacity: 1; }
.strip img { height: 150px; display: block; border-radius: 4px; }
.track .cut { position: absolute; top: 2px; right: 26px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 11px; line-height: 20px; padding: 0; }
.track .cut:hover { background: var(--warn); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; flex: none; }
.spin.big { width: 34px; height: 34px; border-width: 4px; }
@keyframes rot { to { transform: rotate(360deg); } }
.loading { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.wait { display: flex; gap: 16px; align-items: center; }
.wait h3 { margin: 0 0 2px; }
.jobcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.jobcard .top { display: flex; gap: 10px; align-items: center; }
.jobcard .top b { min-width: 110px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.checklist li { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.checklist li.done { color: var(--ok); }
.checklist li.running { color: var(--text); font-weight: 600; }
.checklist li.failed { color: var(--bad); }
#bg { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
#bg span { display: inline-flex; gap: 6px; align-items: center; }
.future { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
@media (max-width: 760px) { .question { grid-template-columns: 1fr; } .card { grid-template-columns: 64px 1fr; } .avatar { width: 64px; height: 64px; } main { padding: 8px; } }
/* 认人（新） */
.subtabs { display: flex; gap: 6px; margin-bottom: 12px; }
.subtab { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.subtab.on { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.editor .who { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: start; }
.editor .avatar { width: 120px; height: 120px; cursor: default; }
.editor .form { display: grid; gap: 10px; }
.avatar.sm { width: 40px; height: 40px; flex: none; border-radius: 50%; overflow: hidden; }
.avatar.sm svg { width: 100%; height: 100%; }
.roles button { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; margin-right: 4px; }
.roles .key, .key.light { border-color: currentColor; color: inherit; opacity: .75; margin-left: 6px; }
input.num.big { width: 90px; font-size: 20px; font-weight: 700; text-align: center; padding: 4px 6px; }
input.num.big:disabled { opacity: .35; }
.note { min-height: 20px; }
.track { cursor: pointer; }
.track.rejected { opacity: .35; outline: 3px solid var(--bad); }
.track.rejected::after, .qtile.rejected::after { content: "不是"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; text-shadow: 0 1px 4px #000; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.rtile { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; border: 1px solid var(--ok); border-radius: 10px; padding: 6px 8px; background: var(--panel); color: var(--text); cursor: pointer; }
.rtile .avatar { grid-row: 1 / 4; }
.rtile.todo { border: 1px dashed var(--warn); }
.rtile:hover { border-color: var(--accent); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin: 8px 0; }
.qtile { position: relative; margin: 0; border: 2px solid var(--line); border-radius: 8px; padding: 3px; cursor: pointer; text-align: center; font-size: 11px; color: var(--muted); background: var(--soft); }
.qtile img { width: 100%; height: 150px; object-fit: contain; display: block; border-radius: 4px; }
.qtile:hover { border-color: var(--accent); }
.qtile.rejected { border-color: var(--bad); }
.qtile.rejected img { opacity: .35; }
.choice.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
@media (max-width: 760px) { .editor .who { grid-template-columns: 72px 1fr; } .editor .avatar { width: 72px; height: 72px; } }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="logo">bball<span>goal</span></div>
    <select id="gamePick"></select>
    <button class="btn" id="newGame">＋ 新比赛</button>
    <div id="bg" style="margin-left:auto"></div>
    <span class="muted" id="saveStatus"></span>
  </div>
  <nav class="steps" id="steps"></nav>
</div>
<main id="main"></main>
<div id="preview"><img><div></div></div>
<script>
// ---------- 小工具 ----------
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const api = async (path, body) => {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};

const spin = (big = false) => h("span", { class: "spin" + (big ? " big" : "") });
const loadingPanel = text => h("div", { class: "panel loading" }, spin(), text);
function fmtEta(sec) {
  if (sec == null) return "";
  if (sec < 60) return "不到 1 分钟";
  const m = Math.round(sec / 60);
  return m < 60 ? `约 ${m} 分钟` : `约 ${Math.floor(m / 60)} 小时 ${m % 60} 分钟`;
}
const STEPS = [
  { key: "import", title: "导入视频" },
  { key: "people", title: "认人" },
  { key: "balls", title: "点球" },
  { key: "events", title: "事件审核" },
  { key: "reels", title: "集锦" },
];
let games = [], game = null, view = "import", pollTimer;

// ---------- 路由：#/比赛名/步骤 ----------
async function route() {
  const [, name, step] = location.hash.split("/");
  games = await api("/api/games");
  const pick = $("#gamePick");
  pick.replaceChildren(...games.map(g => h("option", { value: g.name, selected: g.name === decodeURIComponent(name || "") }, g.name)));
  pick.style.display = games.length ? "" : "none";
  if (name === "new" || !games.length) { game = null; view = "import"; renderSteps(); renderNewGame(); return; }
  const target = decodeURIComponent(name || games[0].name);
  if (game?.name !== target) $("#main").replaceChildren(loadingPanel("正在打开比赛…"));
  game = await api(`/api/games/${encodeURIComponent(target)}`);
  view = step || firstOpenStep(game);
  renderSteps();
  render();
}
// “认人”一步包括名单（people）和整场核对（questions）两部分
function stepState(g, key) {
  if (key !== "people") return g.steps[key];
  const a = g.steps.people, b = g.steps.questions;
  return a === "done" && b === "done" ? "done" : a === "todo" ? "todo" : [a, b].includes("running") && a !== "ready" && b !== "ready" ? "running" : "ready";
}
function firstOpenStep(g) {
  for (const s of STEPS) if (stepState(g, s.key) !== "done") return s.key === "people" && g.steps.people === "done" ? "questions" : s.key;
  return "reels";
}
function go(step, name = game?.name) { location.hash = `#/${encodeURIComponent(name)}/${step}`; }
window.addEventListener("hashchange", route);
$("#gamePick").addEventListener("change", e => go(firstOpenStep(games.find(g => g.name === e.target.value)), e.target.value));
$("#newGame").addEventListener("click", () => { location.hash = "#/new"; });

function renderSteps() {
  const nav = $("#steps");
  nav.replaceChildren(...STEPS.map((s, i) => {
    const state = game ? stepState(game, s.key) : (i === 0 ? "ready" : "todo");
    const on = view === s.key || (s.key === "people" && view === "questions");
    return h("div", { class: `step ${state} ${on ? "on" : ""}`, onclick: () => game && go(s.key === "people" && game.steps.people === "done" ? "questions" : s.key) },
      h("span", { class: "dot" }, state === "done" ? "✓" : i + 1), s.title);
  }));
}

function render() {
  tick = null; document.onkeydown = null;
  renderBg();
  ({ import: renderImport, people: renderPeople, questions: renderQuestions, balls: renderBalls, events: renderEvents, reels: renderReels })[view]();
}

// 定时刷新任务进度：一个全局定时器，顶部栏随时显示后台在干什么；各页面可以登记自己的刷新
let tick = null;
function poll(fn) { tick = fn; }
setInterval(async () => {
  if (!game) return;
  try {
    const before = JSON.stringify(game.steps);
    const fresh = await api(`/api/games/${encodeURIComponent(game.name)}`);
    if (fresh.name !== game.name) return;
    game = fresh;
    renderSteps(); renderBg();
    if (tick) tick(before !== JSON.stringify(game.steps));
  } catch (_) {}
}, 3000);
function renderBg() {
  const bg = $("#bg");
  if (!game) { bg.replaceChildren(); return; }
  const running = Object.entries(game.steps.jobs).filter(([, j]) => j.running);
  bg.replaceChildren(...running.map(([k, j]) => h("span", { title: j.step || "" }, spin(),
    `${JOB_NAMES[k]}：${j.step || ""}${j.detail ? " · " + j.detail : ""}${j.progress != null ? " " + Math.round(j.progress * 100) + "%" : ""}${j.eta != null ? "（" + fmtEta(j.eta) + "）" : ""}`)));
}

function intro(title, what, you, after) {
  return h("div", { class: "intro" }, h("h2", {}, title),
    h("p", {}, h("b", {}, "这一步做什么："), what),
    h("p", {}, h("b", {}, "你要做的："), you),
    after ? h("p", {}, h("b", {}, "完成后："), after) : null);
}

const JOB_NAMES = { import: "导入", enroll: "抽段认人准备", full: "整场处理", assign: "认整场", balltrain: "训练找球模型" };
function jobsPanel(keys) {
  const rows = keys.map(k => [k, game.steps.jobs[k]]).filter(([, j]) => j && j.state !== "none");
  if (!rows.length) return null;
  return h("div", { class: "panel jobs", id: "jobsPanel" }, h("b", {}, "后台处理"), rows.map(([k, j]) => {

  let polygon = [], hoops = [], mode = "polygon";
  const hint = h("span", { class: "hint" });
  const save = h("button", { class: "btn primary", onclick: async () => {

  } }, game.steps.import === "done" ? "保存修改" : "保存，开始处理");
  const redoHoops = h("button", { class: "btn", onclick: () => { hoops = []; mode = "hoops"; draw(); } }, "重新点篮筐");
  const redoPolygon = h("button", { class: "btn", onclick: () => { polygon = []; mode = "polygon"; draw(); } }, "重新画边界");
  const done = h("button", { class: "btn", onclick: () => { if (polygon.length >= 3) { mode = "hoops"; draw(); } } }, "边界画完了");
  const undo = h("button", { class: "btn", onclick: () => { if (mode === "hoops" && hoops.length) hoops.pop(); else if (mode === "hoops") mode = "polygon"; else polygon.pop(); draw(); } }, "撤销");

    h("button", { class: "btn primary", onclick: () => go("people") }, "下一步：认人 →"));

const EV_TYPES = { shot: "出手" };  // 篮板、助攻、抢断试过，持球数据不够准，不做了

const evKind = e => KIND_POINTS[e.kind] ? e.kind : ({ 1: "freethrow", 3: "three" })[Number(e.points)] || "two";

let edata, evs, eReview, eSel = null, eFilter = "todo", ePlayer = "", eSaveTimer;

function evPlayerText(label) {

  if (p) return [edata.teams[p.team]?.name || p.team, p.number ? "#" + p.number : label, p.name].filter(Boolean).join(" ");
  const m = label.match(/^([AB])#(\d+)$/);

}
function evText(e) {

  return EV_TYPES[e.type] || e.type;
}

  for (const e of eReview.added || []) if (e.type === "shot") out.push(e);

}
const evTodo = e => e.status === "auto";
const evShown = e => (eFilter === "all" || (eFilter === "todo" ? evTodo(e) : KIND_POINTS[eFilter] ? evKind(e) === eFilter : e.result === eFilter)) && (!ePlayer || e.player === ePlayer);

const evPoints = e => KIND_POINTS[evKind(e)];
// 事件算哪队：认出了人按人；没认出来用事件自己的 team（按篮筐推断的，或者你选的）
const evTeam = e => edata.people[e.player]?.team || e.team || (e.player?.match(/^([AB])[#?]/)?.[1]) || null;
// 每人（key 换成 evTeam 就是每队）的数据；投篮（两分 fga/fgm）、三分（tpa/tpm）、罚篮（fta/ftm）分开
function evStats(key = e => e.player) {
  const st = {};
  for (const e of evs) {
    const k = key(e);
    if (e.status === "deleted" || !k) continue;
    const s = st[k] ??= { points: 0, fga: 0, fgm: 0, tpa: 0, tpm: 0, fta: 0, ftm: 0 };
    if (e.type === "shot") {
      const [a, m] = { two: ["fga", "fgm"], three: ["tpa", "tpm"], freethrow: ["fta", "ftm"] }[evKind(e)];
      s[a]++;
      if (e.result === "made") { s[m]++; s.points += evPoints(e); }
    }
  }
  return st;
}

    const vkey = `${key}|${has}|${game.steps.reel_files.join(",")}`;
    const player = detail.querySelector("#rplayer");
    const video = player && videoKey === vkey ? player : h("div", { id: "rplayer" }, has ? [
      h("div", { class: "toolbar" }, h("b", {}, "本队五佳球"),
        h("a", { class: "btn", style: "margin-left:auto", href: file(name), download: `${teamLabel(t)}.mp4` }, "下载")),
      h("video", { src: `${file(name)}?${Date.now()}`, controls: true, preload: "metadata", playsinline: true, style: "width:100%;border-radius:8px;background:#000;display:block" })]
      : h("div", { class: "muted", style: "padding:30px;text-align:center" }, "还没有生成"));
    videoKey = vkey;
    detail.replaceChildren(
      h("div", { class: "panel" },
        h("div", { class: "rhead" }, h("span", { class: "rbig", style: "color:#facc15" }, "★"),
          h("div", {}, h("div", { style: "font-size:18px;font-weight:700" }, edata.teams[t]?.name || t), h("div", { class: "meta" }, "本队五佳球")),
          fs[t] != null ? h("div", { class: "rstats" }, h("div", {}, h("b", {}, String(fs[t])), h("span", { class: "meta" }, "全队得分"))) : null),
        h("div", { class: "toolbar", style: "margin-top:12px" }, "文字", seg("lang", [["zh", "中文"], ["en", "English"]], reelPref(key, "lang", "zh")),
          h("label", { class: "meta", style: "font-size:13px" }, h("input", { type: "checkbox", checked: reelPref(key, "music", "1") === "1",
            onchange: e => setReelPref(key, "music", e.target.checked ? "1" : "0") }), " 背景音乐")),
        h("ol", { class: "rtop" }, picks.map((e, i) => h("li", {}, h("b", {}, `第 ${picks.length - i} 名`), h("span", { class: "meta" }, fmt(e.time)),
          evPlayerText(e.player), h("span", { class: "meta" }, evText(e))))),
        picks.length ? null : h("div", { class: "muted" }, "这个队还没有投篮"),
        h("div", { class: "toolbar" }, h("button", { class: "btn primary", disabled: !picks.length || j.running, onclick: () => start(teamRequest(t)) }, has ? "重新生成五佳球" : "生成五佳球"),
          h("span", { class: "meta" }, "按倒计时播：第 5 名到第 1 名；进球不够 5 个用拿不准、没进的补")),
        busy ? h("div", { class: "loading", style: "margin-top:10px" }, spin(), `${j.step}${pct != null ? " · " + pct + "%" : ""}`,
          h("div", { class: "pbar", style: "flex:1" }, h("div", { style: `width:${pct ?? 0}%` }))) : null),
      h("div", { class: "panel" }, video));
  }
  function drawDetail() {
    const p = rSel;
    if (p?.startsWith("team:")) return drawTeam(p.slice(5));
    if (!p) { detail.replaceChildren(h("div", { class: "panel muted" }, "没有球员")); return; }
    const x = info(p), pr = edata.people[p] || {}, j = job();
    const seg = (key, options, value) => h("span", { class: "seg" }, options.map(([v, t]) =>
      h("button", { class: value === v ? "on" : "", onclick: () => { setReelPref(p, key, v); drawDetail(); } }, t)));
    const check = (key, label, fallback) => h("label", { class: "meta", style: "font-size:13px" },
      h("input", { type: "checkbox", checked: reelPref(p, key, fallback) === "1", onchange: e => setReelPref(p, key, e.target.checked ? "1" : "0") }), " ", label);
    const busy = busyFor(p);
    const pct = j.progress != null ? Math.round(j.progress * 100) : null;
    const action = (touch, title, sub, can, why) => h("div", { class: "raction" },
      h("div", {}, h("b", {}, title), h("div", { class: "meta" }, can ? sub : why)),
      h("button", { class: "btn primary", disabled: !can || j.running, onclick: () => start(request(p, touch)) },
        x.files[touch ? "touches" : "shots"] ? "重新生成" : "生成"));
    const kinds = [["shots", "投篮集锦"], ["touches", "触球集锦"]].filter(([k]) => x.files[k]);
    const tab = kinds.find(([k]) => k === rTab[p])?.[0] || kinds[0]?.[0];
    const key = `${p}|${tab}|${x.files[tab] || ""}|${game.steps.reel_files.join(",")}`;
    const player = detail.querySelector("#rplayer");
    const keepVideo = player && videoKey === key;
    const video = keepVideo ? player : h("div", { id: "rplayer" }, tab ? [
      h("div", { class: "toolbar" }, kinds.length > 1 ? h("span", { class: "seg" }, kinds.map(([k, t]) =>
        h("button", { class: k === tab ? "on" : "", onclick: () => { rTab[p] = k; drawDetail(); } }, t))) : h("b", {}, kinds[0][1]),
        h("a", { class: "btn", style: "margin-left:auto", href: file(x.files[tab]), download: `${evPlayerText(p)} ${tab === "touches" ? "触球集锦" : "投篮集锦"}.mp4` }, "下载")),
      h("video", { src: `${file(x.files[tab])}?${Date.now()}`, controls: true, preload: "metadata", playsinline: true, style: "width:100%;border-radius:8px;background:#000;display:block" })]
      : h("div", { class: "muted", style: "padding:30px;text-align:center" }, "还没有生成集锦"));
    videoKey = key;
    detail.replaceChildren(
      h("div", { class: "panel" },
        h("div", { class: "rhead" }, h("span", { class: "rbig" }, pr.number ? "#" + pr.number : "?"),
          h("div", {}, pr.name ? h("div", { style: "font-size:18px;font-weight:700" }, pr.name) : null,
            h("div", { class: pr.name ? "meta" : "", style: pr.name ? "" : "font-size:16px;font-weight:600" }, edata.teams[evTeam({ player: p })]?.name || evPlayerText(p))),
          h("div", { class: "rstats" }, [["得分", x.s.points], ["投篮", `${x.s.fgm}/${x.s.fga}`], ["三分", `${x.s.tpm}/${x.s.tpa}`], ["罚篮", `${x.s.ftm}/${x.s.fta}`], ["拿球", x.touches]]
            .map(([k, v]) => h("div", {}, h("b", {}, String(v)), h("span", { class: "meta" }, k))))),
        h("div", { class: "toolbar", style: "margin-top:12px" }, "文字", seg("lang", [["zh", "中文"], ["en", "English"]], reelPref(p, "lang", "zh")),
          check("music", "背景音乐", "1"), check("misses", "投篮集锦也放没进的", "0")),
        h("div", { class: "ractions" },
          action(false, "投篮集锦", `${x.made} 个进球${x.shots - x.made ? `，没进的 ${x.shots - x.made} 个（勾上才放）` : ""}`, x.shots > 0, "这场没有投篮"),
          action(true, "触球集锦", `拿球 ${x.touches} 次`, x.touches > 0, "跟踪里没认出他拿球")),
        busy ? h("div", { class: "loading", style: "margin-top:10px" }, spin(), `${j.step}${pct != null ? " · " + pct + "%" : ""}`,
          h("div", { class: "pbar", style: "flex:1" }, h("div", { style: `width:${pct ?? 0}%` }))) : null),
      h("div", { class: "panel" }, video));
  }
  function drawAll() { drawTop(); drawRoster(); drawDetail(); }
  main.replaceChildren(head, top, h("div", { class: "reels" }, roster, detail));
  drawAll();
  poll(changed => changed && drawAll());
}

route();
</script>
</body>
</html>
